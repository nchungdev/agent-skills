<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad)" />
  <circle cx="200" cy="270" r="180" fill="url(#glow)" />

  <!-- Frame border -->
  <rect x="8" y="8" width="384" height="584" rx="16" fill="none" stroke="#34d399" stroke-opacity="0.2" stroke-width="2" />

  <!-- Top Badges -->
  <rect x="20" y="24" width="60" height="24" rx="6" fill="#000000" fill-opacity="0.7" />
  <text x="50" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2025</text>

  <rect x="270" y="24" width="110" height="24" rx="6" fill="#e5a00d" />
  <text x="325" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#000000" text-anchor="middle">1080p WEB-DL</text>

  <!-- Center Graphic Icon -->
  <circle cx="200" cy="260" r="70" fill="#000000" fill-opacity="0.4" stroke="#34d399" stroke-opacity="0.3" stroke-width="2" />
  <text x="200" y="285" font-size="64" text-anchor="middle">🐒</text>

  <!-- Japanese Kanji Sub-heading -->
  <text x="200" y="410" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-size="14" font-weight="bold" fill="#34d399" fill-opacity="0.85" text-anchor="middle" letter-spacing="2">齐天大圣 孙悟空</text>

  <!-- Main Series Title -->
  <text x="200" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">WUKONG</text>

  <!-- Vietnamese Subtitle -->
  <text x="200" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1" text-anchor="middle">Ngộ Không 2025</text>

  <!-- Bottom Divider Line -->
  <line x1="40" y1="515" x2="360" y2="515" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Bottom Info Footer -->
  <text x="200" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Tencent Video • 12 Episodes</text>
  <text x="200" y="565" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">tvdb-454526</text>
</svg>
